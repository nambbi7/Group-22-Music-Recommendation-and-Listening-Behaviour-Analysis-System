<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - CHERI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >

</head>

<body>

    <div class="login-container">

        <h1 id="pageTitle">
            {% if forgot_mode %}
                Forgot Password
            {% else %}
                Update Password
            {% endif %}
        </h1>

        <p
            class="subtitle"
            id="pageDescription"
        >
            {% if forgot_mode %}
                Enter your email to receive a password reset link.
            {% else %}
                Create a new password for your CHERI account.
            {% endif %}
        </p>


        <form
            id="emailForm"
            {% if not forgot_mode %}
                style="display: none;"
            {% endif %}
        >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required
            >

            <button
                type="submit"
                id="sendButton"
            >
                Send Reset Link
            </button>

        </form>


        <form
            id="passwordForm"
            {% if forgot_mode %}
                style="display: none;"
            {% endif %}
        >

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >


            <button
                type="submit"
                id="updateButton"
            >
                Update Password
            </button>

        </form>


        <p
            id="message"
            class="login-error"
            style="display: none;"
        ></p>


        <div class="register">

            <a
                href="/login"
                id="backLink"
            >
                Back to Login
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const supabaseUrl =
            "{{ supabase_url }}";

        const supabaseKey =
            "{{ supabase_anon_key }}";


        const supabaseClient =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        const emailForm =
            document.getElementById(
                "emailForm"
            );


        const passwordForm =
            document.getElementById(
                "passwordForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        const updateButton =
            document.getElementById(
                "updateButton"
            );


        const pageTitle =
            document.getElementById(
                "pageTitle"
            );


        const pageDescription =
            document.getElementById(
                "pageDescription"
            );


        function showMessage(text) {

            message.textContent =
                text;

            message.style.display =
                "flex";

        }


        function showPasswordForm() {

            emailForm.style.display =
                "none";

            passwordForm.style.display =
                "block";

            pageTitle.textContent =
                "Reset Password";

            pageDescription.textContent =
                "Create a new password for your CHERI account.";

            message.textContent =
                "";

            message.style.display =
                "none";

        }


        supabaseClient.auth.onAuthStateChange(
            function(event, session) {

                if (
                    event ===
                    "PASSWORD_RECOVERY"
                ) {

                    showPasswordForm();

                }

            }
        );


        emailForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                if (!email) {

                    showMessage(
                        "Please enter your email."
                    );

                    return;

                }


                sendButton.disabled =
                    true;

                sendButton.textContent =
                    "Sending...";


                try {

                    const response =
                        await fetch(
                            "/api/profile/reset-password",
                            {
                                method:
                                    "POST",

                                headers:
                                    {
                                        "Content-Type":
                                            "application/json"
                                    },

                                body:
                                    JSON.stringify({
                                        email:
                                            email
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!data.success) {

                        showMessage(
                            data.error ||
                            "Unable to send reset link."
                        );

                        sendButton.disabled =
                            false;

                        sendButton.textContent =
                            "Send Reset Link";

                        return;

                    }


                    showMessage(
                        "Reset link sent. Check your email and click the link to continue."
                    );

                    sendButton.disabled =
                        true;

                    sendButton.textContent =
                        "Reset Link Sent";


                } catch (error) {

                    showMessage(
                        "Something went wrong. Please try again."
                    );

                    sendButton.disabled =
                        false;

                    sendButton.textContent =
                        "Send Reset Link";

                }

            }
        );


        passwordForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match."
                    );

                    return;

                }


                if (
                    newPassword.length < 6
                ) {

                    showMessage(
                        "Password must be at least 6 characters."
                    );

                    return;

                }


                updateButton.disabled =
                    true;

                updateButton.textContent =
                    "Updating...";


                try {

                    const {
                        error
                    } =
                        await supabaseClient.auth.updateUser({
                            password:
                                newPassword
                        });


                    if (error) {

                        showMessage(
                            error.message
                        );

                        updateButton.disabled =
                            false;

                        updateButton.textContent =
                            "Update Password";

                        return;

                    }


                    showMessage(
                        "Password updated successfully."
                    );

                    updateButton.textContent =
                        "Password Updated";


                    await supabaseClient.auth.signOut();


                    setTimeout(
                        function() {

                            window.location.href =
                                "/login";

                        },
                        1500
                    );


                } catch (error) {

                    showMessage(
                        "Something went wrong."
                    );

                    updateButton.disabled =
                        false;

                    updateButton.textContent =
                        "Update Password";

                }

            }
        );

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - CHERI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/update_password.css') }}"
    >

</head>

<body>

    <div class="password-container">

        <div class="password-card">

            <div class="logo">
                CHERI
            </div>

            <div class="password-icon">
                &#128274;
            </div>

            <h1>
                Reset Password
            </h1>

            <p class="description">
                Create a new password for your CHERI account.
            </p>


            <form id="passwordForm">

                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="updateButton"
                >
                    Update Password
                </button>

            </form>


            <p
                id="message"
                class="message"
            ></p>


            <a
                href="{{ url_for('profile') }}"
                class="back-link"
            >
                Back to Profile
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const supabaseUrl =
            "{{ supabase_url }}";

        const supabaseKey =
            "{{ supabase_anon_key }}";


        const supabaseClient =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        const passwordForm =
            document.getElementById(
                "passwordForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const updateButton =
            document.getElementById(
                "updateButton"
            );


        passwordForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    return;

                }


                if (
                    newPassword.length < 6
                ) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;

                }


                updateButton.disabled =
                    true;

                updateButton.textContent =
                    "Updating...";


                try {

                    const {
                        error
                    } =
                        await supabaseClient.auth.updateUser({
                            password:
                                newPassword
                        });


                    if (error) {

                        message.textContent =
                            error.message;

                        updateButton.disabled =
                            false;

                        updateButton.textContent =
                            "Update Password";

                        return;

                    }


                    message.textContent =
                        "Password updated successfully.";


                    updateButton.textContent =
                        "Password Updated";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/profile";

                        },
                        1500
                    );


                } catch (error) {

                    message.textContent =
                        "Something went wrong.";

                    updateButton.disabled =
                        false;

                    updateButton.textContent =
                        "Update Password";

                }

            }
        );

    </script>

</body>

</html>

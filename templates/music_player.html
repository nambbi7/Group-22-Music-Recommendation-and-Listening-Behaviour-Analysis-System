<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CHERI - Music Player</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/music_player.css') }}">

</head>

<body>

<div class="player-page">

    <div class="player">

        <div class="player-header">

            <div class="player-brand">

                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="CHERI Logo"
                >

                <span>CHERI</span>

            </div>

        </div>


        <div class="spotify-connection">

            <p id="spotifyStatus">
                Checking Spotify connection...
            </p>

            <a
                href="{{ url_for('spotify_login') }}"
                id="connectSpotifyButton"
                class="connect-spotify-btn"
            >
                Connect Spotify
            </a>

        </div>


        <div class="CHERI">

            <input
                type="text"
                id="searchInput"
                placeholder="Search CHERI..."
            >

            <button onclick="searchSpotify()">
                🔍 Search
            </button>

        </div>


        <div
            id="searchResults"
            class="search-results">
        </div>


        <div class="album-art">

            <img
                id="albumImage"
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="Album Art"
            >

        </div>


        <div class="song-info">

            <h1 id="song-title">
                No Song Selected
            </h1>

            <p id="artist">
                Search Spotify to start listening
            </p>

        </div>


        <div class="favourite-control">

            <button
                id="favouriteButton"
                class="favourite-button"
                onclick="toggleFavourite()"
                disabled
                title="Add to favourites"
            >
                ♡
            </button>

            <span id="favouriteStatus">
                Add to favourites
            </span>

        </div>


        <div class="progress-container">

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
                step="0.1"
            >

            <div class="time">

                <span id="current-time">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <div class="controls">

            <button
                onclick="previousSong()"
                title="Previous Song"
            >
                ⏮
            </button>

            <button
                class="play-btn"
                id="playButton"
                onclick="togglePlay()"
            >
                ▶
            </button>

            <button
                onclick="nextSong()"
                title="Next Song"
            >
                ⏭
            </button>

        </div>


        <div class="volume">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <a
            href="{{ url_for('dashboard') }}"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</div>


<script src="https://sdk.scdn.co/spotify-player.js"></script>


<script>

let spotifyPlayer = null;

let deviceId = null;

let spotifyTracks = [];

let currentTrackIndex = -1;

let currentState = null;

let currentHistoryId = null;

let historyTimer = null;

let progressTimer = null;

let lastStatePosition = 0;

let lastStateTime = 0;

let currentTrack = null;

let isFavourite = false;


const title =
    document.getElementById("song-title");

const artist =
    document.getElementById("artist");

const albumImage =
    document.getElementById("albumImage");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("current-time");

const duration =
    document.getElementById("duration");

const volume =
    document.getElementById("volume");

const searchInput =
    document.getElementById("searchInput");

const searchResults =
    document.getElementById("searchResults");

const spotifyStatus =
    document.getElementById("spotifyStatus");

const connectSpotifyButton =
    document.getElementById("connectSpotifyButton");

const favouriteButton =
    document.getElementById("favouriteButton");

const favouriteStatus =
    document.getElementById("favouriteStatus");


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchSpotify();

        }

    }
);


window.onSpotifyWebPlaybackSDKReady = async function() {

    try {

        const response =
            await fetch("/spotify/token");

        const data =
            await response.json();


        if (!data.success) {

            spotifyStatus.textContent =
                "Spotify is not connected.";

            connectSpotifyButton.style.display =
                "inline-block";

            return;

        }


        spotifyPlayer =
            new Spotify.Player({

                name: "CHERI Music Player",

                getOAuthToken: callback => {

                    callback(
                        data.access_token
                    );

                },

                volume: 1.0

            });


        spotifyPlayer.addListener(
            "ready",
            ({ device_id }) => {

                deviceId =
                    device_id;

                spotifyStatus.textContent =
                    "Spotify connected ✓";

                connectSpotifyButton.style.display =
                    "none";

                console.log(
                    "CHERI Spotify Device:",
                    device_id
                );

            }
        );


        spotifyPlayer.addListener(
            "not_ready",
            ({ device_id }) => {

                spotifyStatus.textContent =
                    "Spotify player is offline.";

                console.log(
                    "Device offline:",
                    device_id
                );

            }
        );


        spotifyPlayer.addListener(
            "player_state_changed",
            state => {

                if (!state) {

                    return;

                }

                currentState =
                    state;

                updatePlayerState(
                    state
                );

            }
        );


        spotifyPlayer.addListener(
            "initialization_error",
            ({ message }) => {

                console.error(message);

                spotifyStatus.textContent =
                    "Spotify initialization error.";

            }
        );


        spotifyPlayer.addListener(
            "authentication_error",
            ({ message }) => {

                console.error(message);

                spotifyStatus.textContent =
                    "Spotify authentication error.";

                connectSpotifyButton.style.display =
                    "inline-block";

            }
        );


        spotifyPlayer.addListener(
            "account_error",
            ({ message }) => {

                console.error(message);

                spotifyStatus.textContent =
                    "Spotify Premium is required.";

            }
        );


        await spotifyPlayer.connect();

    }

    catch (error) {

        console.error(error);

        spotifyStatus.textContent =
            "Unable to connect to Spotify.";

    }

};


async function searchSpotify() {

    const query =
        searchInput.value.trim();


    if (!query) {

        return;

    }


    searchResults.innerHTML =
        "Searching Spotify...";


    try {

        const response =
            await fetch(
                "/api/spotify/search?q="
                + encodeURIComponent(query)
            );


        const data =
            await response.json();


        if (!data.success) {

            searchResults.innerHTML =
                "Spotify search failed.";

            return;

        }


        spotifyTracks =
            data.tracks;


        displaySearchResults(
            spotifyTracks
        );

    }

    catch (error) {

        console.error(error);

        searchResults.innerHTML =
            "Search error.";

    }

}


function displaySearchResults(tracks) {

    searchResults.innerHTML =
        "";


    if (tracks.length === 0) {

        searchResults.innerHTML =
            "No songs found.";

        return;

    }


    tracks.forEach(
        (track, index) => {

            const result =
                document.createElement("div");


            result.className =
                "search-result";


            result.innerHTML = `

                <img
                    src="${track.image || ''}"
                    alt="Album"
                >

                <div>

                    <strong>
                        ${escapeHtml(track.name)}
                    </strong>

                    <p>
                        ${escapeHtml(track.artist)}
                    </p>

                </div>

            `;


            result.addEventListener(
                "click",
                function() {

                    playTrack(
                        track,
                        index
                    );

                }
            );


            searchResults.appendChild(
                result
            );

        }
    );

}


async function playTrack(
    track,
    index
) {

    if (!deviceId) {

        alert(
            "Please connect Spotify first."
        );

        return;

    }


    await finishPreviousListening();


    currentTrackIndex =
        index;


    currentTrack =
        track;


    currentHistoryId =
        null;


    isFavourite =
        false;


    favouriteButton.disabled =
        false;


    favouriteButton.textContent =
        "♡";


    favouriteStatus.textContent =
        "Add to favourites";


    lastStatePosition =
        0;


    lastStateTime =
        Date.now();


    title.textContent =
        track.name;


    artist.textContent =
        track.artist;


    if (track.image) {

        albumImage.src =
            track.image;

    }


    progress.value =
        0;


    currentTime.textContent =
        "0:00";


    duration.textContent =
        "0:00";


    try {

        const tokenResponse =
            await fetch(
                "/spotify/token"
            );


        const tokenData =
            await tokenResponse.json();


        if (!tokenData.success) {

            alert(
                "Please connect Spotify again."
            );

            return;

        }


        const playResponse =
            await fetch(
                "https://api.spotify.com/v1/me/player/play?device_id="
                + encodeURIComponent(deviceId),
                {

                    method: "PUT",

                    headers: {

                        "Authorization":
                            "Bearer "
                            + tokenData.access_token,

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        uris: [

                            "spotify:track:"
                            + track.id

                        ]

                    })

                }
            );


        if (!playResponse.ok) {

            const errorText =
                await playResponse.text();

            console.error(
                errorText
            );

            spotifyStatus.textContent =
                "Unable to play this song.";

            return;

        }


        await saveListeningHistory(
            track
        );


        await checkFavourite(
            track.id
        );


        playButton.textContent =
            "⏸";

    }

    catch (error) {

        console.error(error);

    }

}


async function saveListeningHistory(track) {

    try {

        const response =
            await fetch(
                "/api/listening/start",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        spotify_track_id:
                            track.id,

                        title:
                            track.name,

                        artist:
                            track.artist

                    })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            console.error(
                "Listening history error:",
                data.error
            );

            return;

        }


        currentHistoryId =
            data.history_id;


        console.log(
            "Listening history saved:",
            currentHistoryId
        );


        startHistoryTimer();

    }

    catch (error) {

        console.error(
            "History request error:",
            error
        );

    }

}


async function checkFavourite(
    spotifyTrackId
) {

    try {

        const response =
            await fetch(
                "/api/favourites"
            );


        const data =
            await response.json();


        if (!data.success) {

            return;

        }


        const favourite =
            data.favourites.find(
                item =>
                    item.spotify_track_id
                    === spotifyTrackId
            );


        if (favourite) {

            isFavourite =
                true;

            favouriteButton.textContent =
                "♥";

            favouriteStatus.textContent =
                "Added to favourites";

        }

        else {

            isFavourite =
                false;

            favouriteButton.textContent =
                "♡";

            favouriteStatus.textContent =
                "Add to favourites";

        }

    }

    catch (error) {

        console.error(
            "Favourite check error:",
            error
        );

    }

}


async function toggleFavourite() {

    if (!currentTrack) {

        return;

    }


    favouriteButton.disabled =
        true;


    try {

        let response;


        if (!isFavourite) {

            response =
                await fetch(
                    "/api/favourites/add",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            spotify_track_id:
                                currentTrack.id,

                            title:
                                currentTrack.name,

                            artist:
                                currentTrack.artist

                        })

                    }
                );

        }

        else {

            response =
                await fetch(
                    "/api/favourites/remove",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            spotify_track_id:
                                currentTrack.id

                        })

                    }
                );

        }


        const data =
            await response.json();


        if (!data.success) {

            console.error(
                "Favourite error:",
                data.error
            );

            favouriteStatus.textContent =
                "Unable to update favourite.";

            favouriteButton.disabled =
                false;

            return;

        }


        isFavourite =
            !isFavourite;


        if (isFavourite) {

            favouriteButton.textContent =
                "♥";

            favouriteStatus.textContent =
                "Added to favourites";

        }

        else {

            favouriteButton.textContent =
                "♡";

            favouriteStatus.textContent =
                "Removed from favourites";

        }

    }

    catch (error) {

        console.error(
            "Favourite request error:",
            error
        );

        favouriteStatus.textContent =
            "Favourite update failed.";

    }


    favouriteButton.disabled =
        false;

}


function startHistoryTimer() {

    if (historyTimer) {

        clearInterval(
            historyTimer
        );

    }


    historyTimer =
        setInterval(
            updateListeningDuration,
            10000
        );

}


async function updateListeningDuration() {

    if (!currentHistoryId) {

        return;

    }


    if (!currentState) {

        return;

    }


    const durationPlayed =
        Math.floor(
            getCurrentPosition() / 1000
        );


    if (durationPlayed <= 0) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/listening/update",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        history_id:
                            currentHistoryId,

                        duration_played:
                            durationPlayed

                    })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            console.error(
                "Duration update failed:",
                data.error
            );

        }

    }

    catch (error) {

        console.error(
            "Duration update error:",
            error
        );

    }

}


async function finishPreviousListening() {

    stopProgressTimer();


    if (historyTimer) {

        clearInterval(
            historyTimer
        );

        historyTimer =
            null;

    }


    if (!currentHistoryId) {

        return;

    }


    await updateListeningDuration();


    currentHistoryId =
        null;

}


async function togglePlay() {

    if (!spotifyPlayer) {

        return;

    }


    await spotifyPlayer.togglePlay();

}


async function nextSong() {

    if (
        currentTrackIndex >= 0 &&
        currentTrackIndex <
        spotifyTracks.length - 1
    ) {

        currentTrackIndex++;


        const nextTrack =
            spotifyTracks[
                currentTrackIndex
            ];


        await playTrack(
            nextTrack,
            currentTrackIndex
        );


        return;

    }


    if (spotifyPlayer) {

        await spotifyPlayer.nextTrack();

    }

}


async function previousSong() {

    if (
        currentTrackIndex > 0
    ) {

        currentTrackIndex--;


        const previousTrack =
            spotifyTracks[
                currentTrackIndex
            ];


        await playTrack(
            previousTrack,
            currentTrackIndex
        );


        return;

    }


    if (spotifyPlayer) {

        await spotifyPlayer.previousTrack();

    }

}


function updatePlayerState(state) {

    const track =
        state.track_window.current_track;


    if (!track) {

        return;

    }


    title.textContent =
        track.name;


    artist.textContent =
        track.artists
            .map(
                artist => artist.name
            )
            .join(", ");


    if (
        track.album &&
        track.album.images &&
        track.album.images.length > 0
    ) {

        albumImage.src =
            track.album.images[0].url;

    }


    const position =
        state.position;


    const trackDuration =
        state.duration;


    lastStatePosition =
        position;


    lastStateTime =
        Date.now();


    if (trackDuration > 0) {

        progress.value =
            (
                position /
                trackDuration
            ) * 100;

    }


    currentTime.textContent =
        formatTime(
            position
        );


    duration.textContent =
        formatTime(
            trackDuration
        );


    if (state.paused) {

        playButton.textContent =
            "▶";

        stopProgressTimer();

    }

    else {

        playButton.textContent =
            "⏸";

        startProgressTimer();

    }

}


function getCurrentPosition() {

    if (!currentState) {

        return 0;

    }


    if (currentState.paused) {

        return lastStatePosition;

    }


    const elapsed =
        Date.now()
        - lastStateTime;


    let position =
        lastStatePosition
        + elapsed;


    if (
        position >
        currentState.duration
    ) {

        position =
            currentState.duration;

    }


    if (position < 0) {

        position =
            0;

    }


    return position;

}


function startProgressTimer() {

    if (progressTimer) {

        return;

    }


    progressTimer =
        setInterval(
            function() {

                if (
                    !currentState ||
                    currentState.paused
                ) {

                    return;

                }


                const trackDuration =
                    currentState.duration;


                if (trackDuration <= 0) {

                    return;

                }


                const currentPosition =
                    getCurrentPosition();


                progress.value =
                    (
                        currentPosition /
                        trackDuration
                    ) * 100;


                currentTime.textContent =
                    formatTime(
                        currentPosition
                    );

            },
            250
        );

}


function stopProgressTimer() {

    if (progressTimer) {

        clearInterval(
            progressTimer
        );

        progressTimer =
            null;

    }

}


progress.addEventListener(
    "input",
    async function() {

        if (
            !spotifyPlayer ||
            !currentState
        ) {

            return;

        }


        const newPosition =
            (
                progress.value / 100
            ) * currentState.duration;


        lastStatePosition =
            newPosition;


        lastStateTime =
            Date.now();


        currentTime.textContent =
            formatTime(
                newPosition
            );


        await spotifyPlayer.seek(
            newPosition
        );

    }
);


volume.addEventListener(
    "input",
    async function() {

        if (!spotifyPlayer) {

            return;

        }


        await spotifyPlayer.setVolume(
            parseFloat(
                volume.value
            )
        );

    }
);


function formatTime(
    milliseconds
) {

    const seconds =
        Math.floor(
            milliseconds / 1000
        );


    if (
        isNaN(seconds) ||
        seconds < 0
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        seconds % 60;


    return (
        minutes
        + ":"
        + String(
            remainingSeconds
        ).padStart(
            2,
            "0"
        )
    );

}


function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


window.addEventListener(
    "beforeunload",
    function() {

        stopProgressTimer();

        if (historyTimer) {

            clearInterval(
                historyTimer
            );

        }

    }
);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CHERI - Music Player</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/music_player.css') }}">

</head>

<body>

<div class="player-page">

    <div class="player">

        <!-- HEADER -->

        <div class="player-header">

            <div class="player-brand">

                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="CHERI Logo"
                >

                <span>CHERI</span>

            </div>

        </div>


        <!-- SPOTIFY CONNECTION -->

        <div class="spotify-connection">

            <p id="spotifyStatus">
                Checking Spotify connection...
            </p>

            <a
                href="{{ url_for('spotify_login') }}"
                id="connectSpotifyButton"
                class="connect-spotify-btn"
            >
               Connect Spotify
            </a>

        </div>


        <!-- SPOTIFY SEARCH -->

        <div class="CHERI">

            <input
                type="text"
                id="searchInput"
                placeholder="Search CHERI..."
            >

            <button onclick="searchCHERI()">
                🔍 Search
            </button>

        </div>


        <!-- SEARCH RESULTS -->

        <div
            id="searchResults"
            class="search-results">
        </div>


        <!-- ALBUM ART -->

        <div class="album-art">

            <img
                id="albumImage"
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="Album Art"
            >

        </div>


        <!-- SONG INFORMATION -->

        <div class="song-info">

            <h1 id="song-title">
                No Song Selected
            </h1>

            <p id="artist">
                Search Spotify to start listening
            </p>

        </div>


        <!-- PROGRESS -->

        <div class="progress-container">

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
            >

            <div class="time">

                <span id="current-time">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button
                onclick="previousSong()"
                title="Previous Song"
            >
                ⏮
            </button>

            <button
                class="play-btn"
                id="playButton"
                onclick="togglePlay()"
            >
                ▶
            </button>

            <button
                onclick="nextSong()"
                title="Next Song"
            >
                ⏭
            </button>

        </div>


        <!-- VOLUME -->

        <div class="volume">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <!-- BACK -->

        <a
            href="{{ url_for('dashboard') }}"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</div>


<!-- SPOTIFY WEB PLAYBACK SDK -->

<script src="https://sdk.scdn.co/spotify-player.js"></script>


<script>

/* =========================================
   VARIABLES
========================================= */

let spotifyPlayer = null;

let deviceId = null;

let spotifyTracks = [];

let currentTrackIndex = -1;

let currentState = null;


/* =========================================
   HTML ELEMENTS
========================================= */

const title =
    document.getElementById("song-title");

const artist =
    document.getElementById("artist");

const albumImage =
    document.getElementById("albumImage");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("current-time");

const duration =
    document.getElementById("duration");

const volume =
    document.getElementById("volume");

const searchInput =
    document.getElementById("searchInput");

const searchResults =
    document.getElementById("searchResults");

const spotifyStatus =
    document.getElementById("spotifyStatus");

const connectSpotifyButton =
    document.getElementById("connectSpotifyButton");


/* =========================================
   ENTER KEY SEARCH
========================================= */

searchInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            searchSpotify();

        }

    }
);


/* =========================================
   SPOTIFY SDK READY
========================================= */

window.onSpotifyWebPlaybackSDKReady = async function() {

    try {

        const response =
            await fetch("/spotify/token");

        const data =
            await response.json();


        if (!data.success) {

            spotifyStatus.textContent =
                "Spotify is not connected.";

            connectSpotifyButton.style.display =
                "inline-block";

            return;

        }


        spotifyPlayer =
            new Spotify.Player({

                name: "CHERI Music Player",

                getOAuthToken: callback => {

                    callback(
                        data.access_token
                    );

                },

                volume: 1.0

            });


        /* READY */

        spotifyPlayer.addListener(
            "ready",
            ({ device_id }) => {

                deviceId =
                    device_id;

                spotifyStatus.textContent =
                    "Spotify connected ✓";

                connectSpotifyButton.style.display =
                    "none";

                console.log(
                    "CHERI Spotify Device:",
                    device_id
                );

            }
        );


        /* NOT READY */

        spotifyPlayer.addListener(
            "not_ready",
            ({ device_id }) => {

                spotifyStatus.textContent =
                    "Spotify player is offline.";

                console.log(
                    "Device offline:",
                    device_id
                );

            }
        );


        /* PLAYER STATE */

        spotifyPlayer.addListener(
            "player_state_changed",
            state => {

                if (!state) {

                    return;

                }

                currentState =
                    state;

                updatePlayerState(
                    state
                );

            }
        );


        /* INITIALIZATION ERROR */

        spotifyPlayer.addListener(
            "initialization_error",
            ({ message }) => {

                console.error(message);

                spotifyStatus.textContent =
                    "Spotify initialization error.";

            }
        );


        /* AUTH ERROR */

        spotifyPlayer.addListener(
            "authentication_error",
            ({ message }) => {

                console.error(message);

                spotifyStatus.textContent =
                    "Spotify authentication error.";

                connectSpotifyButton.style.display =
                    "inline-block";

            }
        );


        /* ACCOUNT ERROR */

        spotifyPlayer.addListener(
            "account_error",
            ({ message }) => {

                console.error(message);

                spotifyStatus.textContent =
                    "Spotify Premium is required.";

            }
        );


        await spotifyPlayer.connect();

    }

    catch (error) {

        console.error(error);

        spotifyStatus.textContent =
            "Unable to connect to Spotify.";

    }

};


/* =========================================
   SEARCH SPOTIFY
========================================= */

async function searchSpotify() {

    const query =
        searchInput.value.trim();


    if (!query) {

        return;

    }


    searchResults.innerHTML =
        "Searching Spotify...";


    try {

        const response =
            await fetch(
                "/api/spotify/search?q="
                + encodeURIComponent(query)
            );


        const data =
            await response.json();


        if (!data.success) {

            searchResults.innerHTML =
                "Spotify search failed.";

            return;

        }


        spotifyTracks =
            data.tracks;


        displaySearchResults(
            spotifyTracks
        );

    }

    catch (error) {

        console.error(error);

        searchResults.innerHTML =
            "Search error.";

    }

}


/* =========================================
   DISPLAY SEARCH RESULTS
========================================= */

function displaySearchResults(tracks) {

    searchResults.innerHTML =
        "";


    if (tracks.length === 0) {

        searchResults.innerHTML =
            "No songs found.";

        return;

    }


    tracks.forEach(
        (track, index) => {

            const result =
                document.createElement("div");


            result.className =
                "search-result";


            result.innerHTML = `

                <img
                    src="${track.image || ''}"
                    alt="Album"
                >

                <div>

                    <strong>
                        ${escapeHtml(track.name)}
                    </strong>

                    <p>
                        ${escapeHtml(track.artist)}
                    </p>

                </div>

            `;


            result.addEventListener(
                "click",
                function() {

                    playTrack(
                        track,
                        index
                    );

                }
            );


            searchResults.appendChild(
                result
            );

        }
    );

}


/* =========================================
   PLAY SELECTED TRACK
========================================= */

async function playTrack(
    track,
    index
) {

    if (!deviceId) {

        alert(
            "Please connect Spotify first."
        );

        return;

    }


    currentTrackIndex =
        index;


    title.textContent =
        track.name;


    artist.textContent =
        track.artist;


    if (track.image) {

        albumImage.src =
            track.image;

    }


    try {

        const tokenResponse =
            await fetch(
                "/spotify/token"
            );


        const tokenData =
            await tokenResponse.json();


        if (!tokenData.success) {

            alert(
                "Please connect Spotify again."
            );

            return;

        }


        const playResponse =
            await fetch(
                "https://api.spotify.com/v1/me/player/play?device_id="
                + encodeURIComponent(deviceId),
                {

                    method: "PUT",

                    headers: {

                        "Authorization":
                            "Bearer "
                            + tokenData.access_token,

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        uris: [

                            "spotify:track:"
                            + track.id

                        ]

                    })

                }
            );


        if (!playResponse.ok) {

            const errorText =
                await playResponse.text();

            console.error(
                errorText
            );

            spotifyStatus.textContent =
                "Unable to play this song.";

            return;

        }


        playButton.textContent =
            "⏸";

    }

    catch (error) {

        console.error(error);

    }

}


/* =========================================
   PLAY / PAUSE
========================================= */

async function togglePlay() {

    if (!spotifyPlayer) {

        return;

    }


    await spotifyPlayer.togglePlay();

}


/* =========================================
   NEXT SONG
========================================= */

async function nextSong() {

    if (
        currentTrackIndex >= 0 &&
        currentTrackIndex <
        spotifyTracks.length - 1
    ) {

        currentTrackIndex++;

        const nextTrack =
            spotifyTracks[
                currentTrackIndex
            ];


        await playTrack(
            nextTrack,
            currentTrackIndex
        );

        return;

    }


    if (spotifyPlayer) {

        await spotifyPlayer.nextTrack();

    }

}


/* =========================================
   PREVIOUS SONG
========================================= */

async function previousSong() {

    if (
        currentTrackIndex > 0
    ) {

        currentTrackIndex--;

        const previousTrack =
            spotifyTracks[
                currentTrackIndex
            ];


        await playTrack(
            previousTrack,
            currentTrackIndex
        );

        return;

    }


    if (spotifyPlayer) {

        await spotifyPlayer.previousTrack();

    }

}


/* =========================================
   PLAYER STATE
========================================= */

function updatePlayerState(state) {

    const track =
        state.track_window.current_track;


    if (!track) {

        return;

    }


    title.textContent =
        track.name;


    artist.textContent =
        track.artists
            .map(
                artist => artist.name
            )
            .join(", ");


    if (
        track.album &&
        track.album.images &&
        track.album.images.length > 0
    ) {

        albumImage.src =
            track.album.images[0].url;

    }


    const position =
        state.position;


    const trackDuration =
        state.duration;


    if (trackDuration > 0) {

        progress.value =
            (position / trackDuration) * 100;

    }


    currentTime.textContent =
        formatTime(
            position / 1000
        );


    duration.textContent =
        formatTime(
            trackDuration / 1000
        );


    if (state.paused) {

        playButton.textContent =
            "▶";

    }

    else {

        playButton.textContent =
            "⏸";

    }

}


/* =========================================
   PROGRESS BAR
========================================= */

progress.addEventListener(
    "input",
    async function() {

        if (!currentState) {

            return;

        }


        const newPosition =
            (
                progress.value / 100
            ) * currentState.duration;


        await spotifyPlayer.seek(
            newPosition
        );

    }
);


/* =========================================
   VOLUME
========================================= */

volume.addEventListener(
    "input",
    async function() {

        if (!spotifyPlayer) {

            return;

        }


        await spotifyPlayer.setVolume(
            parseFloat(volume.value)
        );

    }
);


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(
    milliseconds
) {

    const seconds =
        Math.floor(
            milliseconds
        );


    if (
        isNaN(seconds) ||
        seconds < 0
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        seconds % 60;


    return (
        minutes
        + ":"
        + String(
            remainingSeconds
        ).padStart(2, "0")
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}

</script>

</body>

</html>

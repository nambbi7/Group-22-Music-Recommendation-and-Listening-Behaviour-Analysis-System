<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHERI - Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

    <div class="dashboard">

        <header class="topbar">

            <div class="brand">

                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Cheri Logo"
                >

                <span>CHERI</span>

            </div>

            <div class="user-section">

                <span>
                    Welcome, {{ session.get("email") }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="logout-btn"
                >
                    Logout
                </a>

            </div>

        </header>


        <main class="main-content">

            <section class="welcome-section">

                <h1>
                    Welcome to CHERI &#127925;
                </h1>

                <p>
                    Cheri where music is cherished
                </p>

            </section>


            <section class="dashboard-grid">


                <div class="dashboard-card">

                    <div class="card-icon">
                        &#127925;
                    </div>

                    <h2>
                        Browse Songs
                    </h2>

                    <p>
                        Explore songs, artists and genres.
                    </p>

                    <a
                        href="{{ url_for('music_player') }}"
                        class="dashboard-btn"
                    >
                        Explore Music
                    </a>

                </div>


                <div class="dashboard-card">

                    <div class="card-icon">
                        &#9829;
                    </div>

                    <h2>
                        My Favourites
                    </h2>

                    <p>
                        View and manage your favourite songs.
                    </p>

                    <a
                        href="{{ url_for('favourites') }}"
                        class="dashboard-btn"
                    >
                        View Favourites
                    </a>

                </div>


            </section>

        </main>

    </div>

</body>

</html>

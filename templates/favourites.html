<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Favourites - CHERI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/favourites.css') }}">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            CHERI
        </div>

        <nav>

            <a href="/dashboard">
                Home
            </a>

            <a href="/search">
                Search
            </a>

            <a href="/library">
                Library
            </a>

            <a href="/favourites"
               class="active">
                Favourites
            </a>

            <a href="/profile">
                Profile
            </a>

        </nav>

    </header>


    <main class="container">

        <section class="hero-section">

            <div class="hero-glow"></div>

            <div class="hero-content">

                <div class="hero-icon">
                    &#9829;
                </div>

                <div class="hero-text">

                    <p class="hero-label">
                        YOUR COLLECTION
                    </p>

                    <h1>
                        My Favourites
                    </h1>

                    <p class="hero-description">
                        Your favourite music, all in one place.
                    </p>

                </div>

            </div>

            <div class="hero-right">

                <div
                    class="hero-count"
                    id="favouriteCount"
                >
                    0
                </div>

                <div class="hero-count-label">
                    SAVED SONGS
                </div>

            </div>

        </section>


        <section class="favourite-section">

            <div class="section-header">

                <div>

                    <h2>
                        Liked Songs
                    </h2>

                    <p>
                        Your personal collection
                    </p>

                </div>

                <span id="songCount">
                    0 Songs
                </span>

            </div>


            <div
                id="songList"
                class="song-list"
            >

                <div class="loading">

                    <div class="loading-icon">
                        &#9835;
                    </div>

                    <p>
                        Loading your favourites...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="https://sdk.scdn.co/spotify-player.js"></script>


    <script>

    let spotifyPlayer = null;

    let deviceId = null;

    let spotifyReady = false;

    let currentPlayingTrack = null;

    let currentPlaying = false;


    const songList =
        document.getElementById(
            "songList"
        );

    const songCount =
        document.getElementById(
            "songCount"
        );

    const favouriteCount =
        document.getElementById(
            "favouriteCount"
        );


    window.onSpotifyWebPlaybackSDKReady =
        async function() {

            try {

                const response =
                    await fetch(
                        "/spotify/token"
                    );

                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    spotifyReady =
                        false;

                    console.log(
                        "Spotify is not connected."
                    );

                    return;

                }


                spotifyPlayer =
                    new Spotify.Player({

                        name:
                            "CHERI Favourites Player",

                        getOAuthToken:
                            callback => {

                                callback(
                                    data.access_token
                                );

                            },

                        volume:
                            1.0

                    });


                spotifyPlayer.addListener(
                    "ready",
                    ({ device_id }) => {

                        deviceId =
                            device_id;

                        spotifyReady =
                            true;

                        console.log(
                            "CHERI Favourites Player Ready:",
                            deviceId
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "not_ready",
                    () => {

                        spotifyReady =
                            false;

                    }
                );


                spotifyPlayer.addListener(
                    "player_state_changed",
                    state => {

                        if (!state) {

                            return;

                        }


                        const track =
                            state.track_window.current_track;


                        if (!track) {

                            return;

                        }


                        currentPlayingTrack =
                            track.id;


                        currentPlaying =
                            !state.paused;


                        updatePlayButtons(
                            track.id,
                            state.paused
                        );

                    }
                );


                spotifyPlayer.addListener(
                    "initialization_error",
                    ({ message }) => {

                        console.error(
                            "Spotify initialization error:",
                            message
                        );

                        spotifyReady =
                            false;

                    }
                );


                spotifyPlayer.addListener(
                    "authentication_error",
                    ({ message }) => {

                        console.error(
                            "Spotify authentication error:",
                            message
                        );

                        spotifyReady =
                            false;

                    }
                );


                spotifyPlayer.addListener(
                    "account_error",
                    ({ message }) => {

                        console.error(
                            "Spotify Premium is required:",
                            message
                        );

                        spotifyReady =
                            false;

                    }
                );


                await spotifyPlayer.connect();

            }

            catch (error) {

                console.error(
                    "Spotify player error:",
                    error
                );

                spotifyReady =
                    false;

            }

        };


    async function loadFavourites() {

        try {

            const response =
                await fetch(
                    "/api/favourites"
                );


            const data =
                await response.json();


            if (!data.success) {

                songList.innerHTML =
                    `
                    <div class="empty-message">

                        <div class="empty-icon">
                            &#9888;
                        </div>

                        <h3>
                            Unable to load favourites
                        </h3>

                        <p>
                            Please refresh the page and try again.
                        </p>

                    </div>
                    `;

                return;

            }


            const favourites =
                data.favourites || [];


            songCount.textContent =
                favourites.length
                + (
                    favourites.length === 1
                    ? " Song"
                    : " Songs"
                );


            favouriteCount.textContent =
                favourites.length;


            if (favourites.length === 0) {

                songList.innerHTML =
                    `
                    <div class="empty-message">

                        <div class="empty-heart">
                            &#9825;
                        </div>

                        <h3>
                            No Favourite Songs
                        </h3>

                        <p>
                            Start liking songs and they will appear here.
                        </p>

                        <a
                            href="/search"
                            class="browse-button"
                        >
                            Find Music
                        </a>

                    </div>
                    `;

                return;

            }


            songList.innerHTML =
                "";


            favourites.forEach(
                (song, index) => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    const trackId =
                        song.spotify_track_id
                        || "";


                    card.className =
                        "song-card";


                    card.dataset.trackId =
                        trackId;


                    const image =
                        song.image
                        || "https://placehold.co/500x500/15151d/ffffff?text=%E2%99%AA";


                    let songDuration =
                        "--:--";


                    if (
                        song.duration &&
                        song.duration > 0
                    ) {

                        songDuration =
                            formatTime(
                                song.duration
                            );

                    }


                    card.innerHTML =
                        `

                        <div class="song-number">
                            ${index + 1}
                        </div>


                        <div class="album-wrapper">

                            <img
                                src="${escapeHtml(image)}"
                                alt="Album artwork"
                                class="album-image"
                            >


                            <button
                                class="image-play-button"
                                title="Play"
                            >
                                &#9654;
                            </button>

                        </div>


                        <div class="song-info">

                            <h3>
                                ${escapeHtml(
                                    song.title
                                )}
                            </h3>

                            <p>
                                ${escapeHtml(
                                    song.artist
                                )}
                            </p>

                        </div>


                        <span class="duration">
                            ${songDuration}
                        </span>


                        <button
                            class="play-button"
                            title="Play song"
                        >
                            &#9654;
                        </button>


                        <button
                            class="heart-button"
                            title="Remove from favourites"
                        >
                            &#9829;
                        </button>

                        `;


                    const imagePlayButton =
                        card.querySelector(
                            ".image-play-button"
                        );


                    const playButton =
                        card.querySelector(
                            ".play-button"
                        );


                    const heartButton =
                        card.querySelector(
                            ".heart-button"
                        );


                    imagePlayButton.addEventListener(
                        "click",
                        function() {

                            playSong(
                                trackId,
                                imagePlayButton
                            );

                        }
                    );


                    playButton.addEventListener(
                        "click",
                        function() {

                            playSong(
                                trackId,
                                playButton
                            );

                        }
                    );


                    heartButton.addEventListener(
                        "click",
                        function() {

                            removeFavourite(
                                trackId,
                                heartButton
                            );

                        }
                    );


                    songList.appendChild(
                        card
                    );

                }
            );

        }

        catch (error) {

            console.error(
                "Favourite loading error:",
                error
            );


            songList.innerHTML =
                `
                <div class="empty-message">

                    <div class="empty-icon">
                        &#9888;
                    </div>

                    <h3>
                        Connection Error
                    </h3>

                    <p>
                        Unable to connect to the server.
                    </p>

                </div>
                `;

        }

    }


    async function playSong(
        spotifyTrackId,
        button
    ) {

        if (!spotifyTrackId) {

            alert(
                "This song does not have a Spotify track ID."
            );

            return;

        }


        if (
            !spotifyPlayer ||
            !deviceId ||
            !spotifyReady
        ) {

            alert(
                "Please connect Spotify from the Music Player first."
            );

            return;

        }


        try {

            button.disabled =
                true;


            if (
                currentPlayingTrack ===
                spotifyTrackId
            ) {

                await spotifyPlayer.togglePlay();

                button.disabled =
                    false;

                return;

            }


            const tokenResponse =
                await fetch(
                    "/spotify/token"
                );


            const tokenData =
                await tokenResponse.json();


            if (
                !tokenResponse.ok ||
                !tokenData.success
            ) {

                alert(
                    "Spotify connection expired. Please connect Spotify again."
                );

                button.disabled =
                    false;

                return;

            }


            const playResponse =
                await fetch(
                    "https://api.spotify.com/v1/me/player/play?device_id="
                    + encodeURIComponent(
                        deviceId
                    ),
                    {

                        method:
                            "PUT",

                        headers: {

                            "Authorization":
                                "Bearer "
                                + tokenData.access_token,

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                uris: [

                                    "spotify:track:"
                                    + spotifyTrackId

                                ]

                            })

                    }
                );


            if (!playResponse.ok) {

                const errorText =
                    await playResponse.text();


                console.error(
                    "Spotify play error:",
                    errorText
                );


                alert(
                    "Unable to play this song. Make sure Spotify is connected and your account has Premium."
                );


                button.disabled =
                    false;

                return;

            }


            currentPlayingTrack =
                spotifyTrackId;

            currentPlaying =
                true;


            updatePlayButtons(
                spotifyTrackId,
                false
            );

        }

        catch (error) {

            console.error(
                "Play song error:",
                error
            );


            alert(
                "Unable to play the song."
            );

        }


        button.disabled =
            false;

    }


    function updatePlayButtons(
        spotifyTrackId,
        paused
    ) {

        const cards =
            document.querySelectorAll(
                ".song-card"
            );


        cards.forEach(
            card => {

                const buttons =
                    card.querySelectorAll(
                        ".image-play-button, .play-button"
                    );


                buttons.forEach(
                    button => {

                        button.innerHTML =
                            "&#9654;";

                    }
                );

            }
        );


        const currentCard =
            Array.from(
                cards
            ).find(
                card =>
                    card.dataset.trackId ===
                    spotifyTrackId
            );


        if (
            currentCard &&
            !paused
        ) {

            const buttons =
                currentCard.querySelectorAll(
                    ".image-play-button, .play-button"
                );


            buttons.forEach(
                button => {

                    button.innerHTML =
                        "&#9208;";

                }
            );

        }

    }


    async function removeFavourite(
        spotifyTrackId,
        button
    ) {

        try {

            button.disabled =
                true;


            const response =
                await fetch(
                    "/api/favourites/remove",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                spotify_track_id:
                                    spotifyTrackId

                            })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                alert(
                    data.error
                    || "Unable to remove favourite."
                );


                button.disabled =
                    false;

                return;

            }


            if (
                currentPlayingTrack ===
                spotifyTrackId
            ) {

                currentPlayingTrack =
                    null;

                currentPlaying =
                    false;

            }


            loadFavourites();

        }

        catch (error) {

            console.error(
                "Remove favourite error:",
                error
            );


            button.disabled =
                false;

        }

    }


    function formatTime(
        seconds
    ) {

        const totalSeconds =
            Math.floor(
                seconds
            );


        const minutes =
            Math.floor(
                totalSeconds / 60
            );


        const remainingSeconds =
            totalSeconds % 60;


        return (
            minutes
            + ":"
            + String(
                remainingSeconds
            ).padStart(
                2,
                "0"
            )
        );

    }


    function escapeHtml(
        text
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text
            || "";


        return div.innerHTML;

    }


    loadFavourites();

    </script>

</body>

</html>
